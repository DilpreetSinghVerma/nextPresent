<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NXTslide Laser & Magnifier Overlay</title>
  <style>
    :root {
      --laser-red: #ff1244;
      --laser-glow: rgba(255, 18, 68, 0.85);
      --lens-cyan: #38bdf8;
      --lens-glow: rgba(56, 189, 248, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    /* Laser Pointer Layer */
    #laserOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999999;
    }

    /* Ultra-Realistic Presentation Laser Pointer Dot */
    #laserDot {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 
        0 0 4px 1px #ffffff,
        0 0 14px 4px var(--laser-red),
        0 0 32px 10px var(--laser-glow),
        0 0 65px 22px rgba(255, 18, 68, 0.45);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.08s ease-out;
      will-change: left, top, opacity;
    }

    #laserDot::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 80, 110, 0.6);
      transform: translate(-50%, -50%) scale(0.9);
      animation: laserPulse 1.2s infinite ease-out;
      pointer-events: none;
    }

    @keyframes laserPulse {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.9; }
      50% { transform: translate(-50%, -50%) scale(1.35); opacity: 0.3; }
      100% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.9; }
    }

    #laserDot.visible {
      opacity: 1;
    }

    /* Precision Presentation Screen Magnifier Lens */
    #magnifierOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 999998;
      opacity: 0;
      transition: opacity 0.15s ease-out;
      will-change: left, top, opacity;
    }

    #magnifierOverlay.visible {
      opacity: 1;
    }

    .magnifier-lens {
      position: absolute;
      top: 0;
      left: 0;
      width: 230px;
      height: 230px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 3.5px solid var(--lens-cyan);
      box-shadow: 
        0 0 0 9999px rgba(10, 15, 28, 0.62),
        0 0 35px 8px var(--lens-glow),
        inset 0 0 25px rgba(56, 189, 248, 0.35),
        0 0 0 1.5px rgba(255, 255, 255, 0.85);
      background: radial-gradient(circle, rgba(56, 189, 248, 0.04) 0%, rgba(56, 189, 248, 0.12) 100%);
      pointer-events: none;
    }

    .lens-glare {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.05) 45%, transparent 60%);
      pointer-events: none;
    }

    .reticle-top {
      position: absolute;
      top: 6px;
      left: 50%;
      width: 2px;
      height: 12px;
      background: rgba(56, 189, 248, 0.85);
      transform: translateX(-50%);
    }

    .reticle-bottom {
      position: absolute;
      bottom: 6px;
      left: 50%;
      width: 2px;
      height: 12px;
      background: rgba(56, 189, 248, 0.85);
      transform: translateX(-50%);
    }

    .reticle-left {
      position: absolute;
      left: 6px;
      top: 50%;
      width: 12px;
      height: 2px;
      background: rgba(56, 189, 248, 0.85);
      transform: translateY(-50%);
    }

    .reticle-right {
      position: absolute;
      right: 6px;
      top: 50%;
      width: 12px;
      height: 2px;
      background: rgba(56, 189, 248, 0.85);
      transform: translateY(-50%);
    }

    .reticle-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      transform: translate(-50%, -50%);
    }

    .magnifier-badge {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.6);
      border-radius: 999px;
      padding: 2px 10px;
      position: absolute;
      bottom: -13px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div id="laserOverlay">
    <div id="laserDot"></div>
  </div>
  <div id="magnifierOverlay">
    <div class="magnifier-lens">
      <div class="lens-glare"></div>
      <div class="reticle-top"></div>
      <div class="reticle-bottom"></div>
      <div class="reticle-left"></div>
      <div class="reticle-right"></div>
      <div class="reticle-center"></div>
      <div class="magnifier-badge">🔍 MAGNIFIER</div>
    </div>
  </div>

  <script>
    const laserDot = document.getElementById('laserDot');
    const magnifierOverlay = document.getElementById('magnifierOverlay');

    let pointerStyle = 'laser'; // 'laser' | 'magnifier'
    let isPointing = false;

    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let currentX = targetX;
    let currentY = targetY;

    // Fast, responsive tracking (0.55 = instant crisp follow)
    const GLIDE_FACTOR = 0.55;

    function renderLoop() {
      if (isPointing) {
        currentX += (targetX - currentX) * GLIDE_FACTOR;
        currentY += (targetY - currentY) * GLIDE_FACTOR;

        if (pointerStyle === 'laser') {
          laserDot.style.left = `${currentX}px`;
          laserDot.style.top = `${currentY}px`;
        } else {
          magnifierOverlay.style.left = `${currentX}px`;
          magnifierOverlay.style.top = `${currentY}px`;
        }
      }
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    function updateVisuals(visible) {
      if (pointerStyle === 'laser') {
        magnifierOverlay.classList.remove('visible');
        if (visible) {
          laserDot.classList.add('visible');
          laserDot.style.left = `${currentX}px`;
          laserDot.style.top = `${currentY}px`;
        } else {
          laserDot.classList.remove('visible');
        }
      } else {
        laserDot.classList.remove('visible');
        if (visible) {
          magnifierOverlay.classList.add('visible');
          magnifierOverlay.style.left = `${currentX}px`;
          magnifierOverlay.style.top = `${currentY}px`;
        } else {
          magnifierOverlay.classList.remove('visible');
        }
      }
    }

    // Connect to local WebSocket
    function connectWs() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetPort = urlParams.get('port') || '3333';
      const host = (location.host && location.host.trim() !== '') ? location.host : `127.0.0.1:${targetPort}`;
      const protocol = (location.protocol === 'https:') ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${host}/ws?role=laser-overlay`;

      let ws;
      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        setTimeout(connectWs, 1500);
        return;
      }

      ws.onopen = () => {
        console.log('[Laser Overlay] Connected to host WebSocket at', wsUrl);
      };

      ws.onerror = () => {
        try { ws.close(); } catch (_) {}
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === 'LASER_DOWN') {
            isPointing = true;
            if (msg.style) {
              pointerStyle = (msg.style === 'magnifier' || msg.style === 'spotlight') ? 'magnifier' : 'laser';
            }
            targetX = msg.x * window.innerWidth;
            targetY = msg.y * window.innerHeight;
            currentX = targetX;
            currentY = targetY;
            updateVisuals(true);
          } else if (msg.type === 'LASER_MOVE') {
            targetX = msg.x * window.innerWidth;
            targetY = msg.y * window.innerHeight;
          } else if (msg.type === 'LASER_UP') {
            isPointing = false;
            updateVisuals(false);
          } else if (msg.type === 'LASER_STYLE') {
            pointerStyle = (msg.style === 'magnifier' || msg.style === 'spotlight') ? 'magnifier' : 'laser';
            if (isPointing) updateVisuals(true);
          }
        } catch (_) {}
      };

      ws.onclose = () => {
        setTimeout(connectWs, 1500);
      };
    }

    connectWs();

    window.addEventListener('resize', () => {
      targetX = window.innerWidth / 2;
      targetY = window.innerHeight / 2;
    });
  </script>
</body>
</html>
